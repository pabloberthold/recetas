<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <!-- Empanada -->
      <ellipse cx="20" cy="20" rx="14" ry="8" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
      <path d="M6 20 Q20 10 34 20" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
      <!-- Tenedor -->
      <line x1="60" y1="10" x2="60" y2="30" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
      <line x1="57" y1="10" x2="57" y2="17" stroke="rgba(255,255,255,0.1)" stroke-width="1.2"/>
      <line x1="63" y1="10" x2="63" y2="17" stroke="rgba(255,255,255,0.1)" stroke-width="1.2"/>
      <!-- Llama -->
      <path d="M20 55 Q18 48 22 45 Q20 52 25 50 Q22 56 26 58 Q20 58 20 55Z" fill="rgba(255,200,50,0.15)"/>
      <!-- Mate -->
      <ellipse cx="62" cy="58" rx="8" ry="10" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
      <line x1="62" y1="48" x2="68" y2="42" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="800" height="200" fill="url(#grid)"/>
</svg>
